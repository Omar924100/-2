name: ctf08-sentinel-soc

networks:
  edge:                 # joueur <-> web
  backend:
    internal: true      # db : zéro egress internet

services:
  db:
    image: mysql:8.0
    networks: [backend]          # pas de 'ports:' -> injoignable mel host
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sentinel_soc
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - sentinel-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 5s
      retries: 40
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

  web:
    build: .
    networks: [edge, backend]
    ports:
      - "8008:80"
    environment:
      FLAG: ${FLAG}
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN"]  # Apache: bind :80 + drop vers www-data
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

volumes:
  sentinel-db-data:
